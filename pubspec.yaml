name: heres_the_move
description: "Here's the Move — practical ways for men to support their partner."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # State management.
  flutter_riverpod: ^3.4.3

  # Declarative routing.
  go_router: ^18.0.2

  # Date/number formatting for cycle, mission and streak surfaces.
  intl: ^0.20.3

  # Icon set (single, consistent, tree-shakeable).
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
